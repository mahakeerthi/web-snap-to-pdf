<!doctype html>
<html lang="en" data-boot>
<head>
  <meta charset="utf-8">
  <title>Your PDF is ready – Web Snap PDF</title>
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <header>
    <img src="../../icons/icon32.png" alt="" width="22" height="22">
    <div class="meta">
      <span id="filename" class="name">Loading your PDF…</span>
      <span id="size" class="muted"></span>
    </div>
    <div class="actions">
      <button type="button" id="btn-download" class="primary" disabled>Download</button>
      <button type="button" id="btn-close">Close</button>
    </div>
  </header>
  <div id="message" class="message hidden" role="status"></div>
  <iframe id="frame" title="Your PDF"></iframe>
  <script type="module" src="viewer.js"></script>
</body>
</html>
