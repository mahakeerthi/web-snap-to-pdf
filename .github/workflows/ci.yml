name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  # `test` is the required status check on main. Renaming the job breaks that rule.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Known vulnerabilities in dependencies
        run: npm audit --audit-level=moderate

      - name: Registry signatures of installed packages
        run: npm audit signatures

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Install poppler (pdfinfo, pdftotext, pdfimages)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Lint, format and locale checks
        run: npm run check

      - name: Release tooling
        run: npm run test:release

      - name: End-to-end PDF pipeline
        run: npm test

      - name: Content-script checks
        run: npm run test:content

      - name: UI screenshots
        run: npm run test:ui

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-screenshots
          path: test/out/ui
          if-no-files-found: ignore
          overwrite: true
