name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Install poppler (pdfinfo, pdftotext)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Lint, format and locale checks
        run: npm run check

      - name: End-to-end PDF pipeline
        run: npm test

      - name: Content-script checks
        run: npm run test:content

      - name: UI screenshots
        run: npm run test:ui

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: test/out/ui
          if-no-files-found: ignore
