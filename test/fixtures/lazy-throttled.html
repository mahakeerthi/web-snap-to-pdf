<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Throttled Loader Fixture</title>
<style>
  body { margin: 0; font-family: sans-serif; }
  .block { box-sizing: border-box; padding: 16px; border-top: 1px solid #ccc; }
  .block img { display: block; width: 300px; height: 120px; background: #ccc; }
</style>
</head>
<body>
<script>
  // ?stuck=<n>: n blocks of 1,000 px first, each with an image that never loads.
  // Then 60 blocks of 2,000 px, each with a distinct 300 x 120 image that a scroll handler
  // (leading + trailing throttle, ?t=<ms>, default 50) copies from data-echo, an attribute the
  // content script does not read. ?ph=blur starts each one as a 32 x 20 preview shown at
  // 300 x 120, ?ph=blob as the same preview behind a blob: URL; otherwise it has no src.
  // ?mixed=1: 34 such blocks instead, each followed by two 2,000 px blocks with an image that
  // never loads.
  const q = new URLSearchParams(location.search);
  const STUCK = Number(q.get('stuck') || 0);
  const PH = q.get('ph') || 'none';
  const THROTTLE_MS = Number(q.get('t') || 50);
  const MIXED = q.get('mixed') === '1';
  const TOTAL = MIXED ? 34 : 60;
  const imageUrl = (i, w, h) => {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    ctx.fillStyle = `hsl(${(i * 37) % 360} 70% 45%)`; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#fff'; ctx.font = (h / 5) + 'px sans-serif'; ctx.fillText('img ' + i, 4, h / 2);
    return c.toDataURL('image/png');
  };
  const blobUrl = (i) => {
    const bin = atob(imageUrl(i, 32, 20).split(',')[1]);
    const bytes = Uint8Array.from(bin, (ch) => ch.charCodeAt(0));
    return URL.createObjectURL(new Blob([bytes], { type: 'image/png' }));
  };
  const placeholder = (i) =>
    PH === 'blur' ? ` src="${imageUrl(i, 32, 20)}"` : PH === 'blob' ? ` src="${blobUrl(i)}"` : '';
  let html = '';
  for (let i = 0; i < STUCK; i++) {
    html += `<div class="block" style="height:1000px"><p>STUCK-${i}-MARK</p><img alt=""></div>`;
  }
  for (let i = 0; i < TOTAL; i++) {
    html += `<div class="block" style="height:2000px"><p>BLOCK-${i}-MARK</p>` +
      `<img class="lazy" data-echo="${imageUrl(i, 300, 120)}"${placeholder(i)} alt=""></div>`;
    if (MIXED) html += '<div class="block" style="height:2000px"><img alt=""></div>'.repeat(2);
  }
  document.body.innerHTML = html;

  window.__lazyTotal = TOTAL;
  window.__lazyFilled = () => document.querySelectorAll('img.lazy[data-filled]').length;
  const fillVisible = () => {
    for (const img of document.querySelectorAll('img.lazy:not([data-filled])')) {
      const r = img.getBoundingClientRect();
      if (r.bottom > 0 && r.top < innerHeight) {
        img.src = img.dataset.echo;
        img.dataset.filled = '1';
      }
    }
  };
  let last = 0;
  let trailing = null;
  addEventListener('scroll', () => {
    const wait = THROTTLE_MS - (Date.now() - last);
    if (wait <= 0) {
      last = Date.now();
      fillVisible();
    } else if (!trailing) {
      trailing = setTimeout(() => {
        trailing = null;
        last = Date.now();
        fillVisible();
      }, wait);
    }
  });
  fillVisible();
</script>
</body>
</html>
