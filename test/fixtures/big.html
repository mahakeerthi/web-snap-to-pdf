<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Big Fixture</title>
<style>body{font-family:sans-serif} canvas{display:block;margin:8px 0}</style></head>
<body>
<h1>BIG-MARK noise images</h1>
<p>Each canvas holds incompressible noise so the PDF is several megabytes.</p>
<script>
  // ?n=<canvas count>&s=<canvas side in px>. The noise comes from a seeded generator, so every
  // load prints the same pixels. The defaults (3 canvases of 1400 px) are the large-PDF test's size;
  // n=12&s=1400 prints about 70 MB (scripts/pdf-save-perf.mjs).
  const q = new URLSearchParams(location.search);
  const n = Number(q.get('n') || 3);
  const s = Number(q.get('s') || 1400);
  let seed = 12345;
  const rnd = () => ((seed = (Math.imul(seed, 1103515245) + 12345) >>> 0) >>> 24);
  for (let i = 0; i < n; i++) {
    const c = document.createElement('canvas'); c.width = s; c.height = s;
    const ctx = c.getContext('2d');
    const img = ctx.createImageData(s, s);
    const d = img.data;
    for (let j = 0; j < d.length; j += 4) { d[j] = rnd(); d[j+1] = rnd(); d[j+2] = rnd(); d[j+3] = 255; }
    ctx.putImageData(img, 0, 0);
    document.body.appendChild(c);
  }
</script>
</body>
</html>
