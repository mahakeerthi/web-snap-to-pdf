<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scroll Containers Fixture</title>
<style>
  /* Typical chat / web-app shell: the document never scrolls, an inner pane does. */
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: sans-serif; }
  #app { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  #top { flex: 0 0 48px; background: #222; color: #fff; }
  #messages { flex: 1 1 0; overflow-y: auto; padding: 0 16px; }
  .msg { margin: 8px 0; padding: 8px; background: #eef; }
  pre#code { max-height: 80px; overflow: auto; white-space: pre; background: #f4f4f4; font: 12px monospace; }
  p.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; width: 300px; }
  .crop { width: 200px; height: 60px; overflow: hidden; }
  .crop div { height: 400px; background: linear-gradient(red, blue); }
</style>
</head>
<body>
<div id="app">
  <div id="top">APP-HEADER</div>
  <div id="messages"></div>
</div>
<script>
  const box = document.getElementById('messages');
  let html = '';
  for (let i = 0; i < 120; i++) {
    html += '<div class="msg">Message ' + i + ' lorem ipsum dolor sit amet.</div>';
    if (i === 3) {
      let code = '';
      for (let j = 0; j < 30; j++) code += 'const line' + j + ' = "' + 'x'.repeat(260) + '";\n';
      html += '<pre id="code">' + code + '</pre>';
      html += '<p class="clamp" id="clamp">' + 'Clamped teaser text that is intentionally cut after two lines. '.repeat(8) + '</p>';
      html += '<div class="crop" id="crop"><div></div></div>';
    }
  }
  html += '<div class="msg" id="last">LAST-MESSAGE-MARK</div>';
  box.innerHTML = html;
</script>
</body>
</html>
